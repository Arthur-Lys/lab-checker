<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab checker</title>
<style>
body{font:14px/1.45 system-ui,sans-serif;margin:0;padding:20px 16px;background:#f6f7f9;color:#1c1e21}
main{max-width:960px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#6b7280;margin:0 0 16px}
.card{background:#fff;border:1px solid #dde1e6;border-radius:8px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin:8px 0 4px}
input,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid #c9ced6;border-radius:6px;font:inherit;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:600px){.row{grid-template-columns:1fr}}
.labs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.labs label{font-weight:400;margin:0;display:flex;gap:4px;align-items:center}
button{padding:8px 14px;border:0;border-radius:6px;background:#2563eb;color:#fff;font:inherit;cursor:pointer}
button.ghost{background:#e5e7eb;color:#111;padding:4px 10px}
button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px;border-bottom:1px solid #eee;vertical-align:top}
.ok{color:#15803d;font-weight:600}.bad{color:#b91c1c;font-weight:600}.wait{color:#6b7280}
.why{margin:4px 0;color:#374151;max-width:70ch}
pre{white-space:pre-wrap;margin:6px 0 0;font-size:12px;color:#374151}
details summary{cursor:pointer;color:#2563eb;font-size:13px}
.note{font-size:13px;color:#6b7280}
</style>
</head>
<body>
<main id="root"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel">
const {useState, useEffect} = React;

const COURSES = {
  professional_python: {label: "Професійний Python", labs: 10, groups: ["ФеП-31", "ФеП-32", "ФеП-33"]},
  functional_programming: {label: "Функціональне програмування", labs: 8, groups: ["ФЕП-22с", "ФЕП-23с", "ФеП-21"]},
};
const labsOf = (course) => Array.from({length: COURSES[course].labs}, (_, i) => `Lab_${String(i + 1).padStart(2, "0")}`);

// every answer the checker has been seen to give, and what it actually means
const EXPLAIN = [
  [/Не вдалося клонувати/, "Сервер не зміг зробити git clone. Причини: помилка в назві (формат рівно user/repo, без https://), репозиторій приватний або не існує. «could not read Username» = GitHub відповів 404 і git спробував спитати пароль."],
  [/не знайдено каталог Lab_/, "У корені репозиторію нема каталогу з такою назвою. Треба Lab_01, Lab_02 … саме так, з нулем і підкресленням, у корені, а не в підкаталозі."],
  [/REPORT_NOT_FOUND/, "У каталозі лабораторної нема файлу звіту. Сервер шукає pdf або docx, у назві якого є «report», «zvit» або «звіт» (наприклад Lab_01_report.pdf). Кирилиця в назві працює гірше — краще ASCII."],
  [/декілька можливих звітів/, "Файлів, схожих на звіт, більше одного. Має лишитися рівно один pdf або docx з «report» у назві."],
  [/CONTENT_VARIANT_MISMATCH/, "Сервер каже, що зміст не відповідає варіанту. Станом на 15.09.2026 ця перевірка відхиляє все: власний текст завдання викладача, pdf і docx, різні варіанти. Це помилка на сервері — з твого боку виправити нічого не можна, писати викладачу."],
  [/VARIANT_MISMATCH/, "Номер варіанта у звіті (сервер читає «Варіант №N» з тексту) не збігається з варіантом, який у таблиці викладача закріплено за цим студентом. Або виправ номер, або ти не той студент."],
  [/не належить курсу/, "Групу написано не так, як у списку сервера. Копіюй точно з переліку в повідомленні (наприклад ФеП-31, з маленькою «е»)."],
  [/Rules for course .* were not found/, "На сервері нема модуля правил для цієї лабораторної (rules.<курс>.labNN). Її ще ніхто не може перевірити, поки викладач не додасть правила. Це не про твій код."],
  [/^До захисту ДОПУЩЕНО/m, "Звіт пройшов. Далі на сайті стартує тест із 50 випадкових питань — його треба проходити на сайті викладача, ця сторінка сесію тесту не переносить."],
  [/Помилка під час/, "Необроблений виняток на сервері (HTTP 500). Текст після назви винятку — це його внутрішня помилка, а не оцінка твоєї роботи."],
  [/^Error:/, "Наш проксі не додзвонився до сервера перевірки (він на безкоштовному Render і засинає — спробуй ще раз за хвилину)."],
];
const explain = (text) => (EXPLAIN.find(([re]) => re.test(text)) || [null, "Невідома відповідь — читай повний текст нижче."])[1];

const KEY = "lab-checker-form";
const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })();

function App() {
  const [form, setForm] = useState({student_name: "", course: "professional_python", group: "ФеП-31",
                                    repository: "", labs: ["Lab_01"], ...saved});
  const [rows, setRows] = useState({});
  const [running, setRunning] = useState(false);
  const labs = labsOf(form.course);
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(form)); } catch {} }, [form]);

  const set = (k) => (e) => setForm({...form, [k]: e.target.value});
  const setCourse = (e) => {
    const course = e.target.value;
    setForm({...form, course, group: COURSES[course].groups[0], labs: form.labs.filter(l => labsOf(course).includes(l))});
    setRows({});
  };
  const toggle = (lab) => setForm({...form, labs: form.labs.includes(lab) ? form.labs.filter(l => l !== lab) : [...form.labs, lab].sort()});

  async function submitOne(lab) {
    setRows(r => ({...r, [lab]: {state: "wait"}}));
    let data;
    try {
      const res = await fetch("/api/submit", {method: "POST", headers: {"content-type": "application/json"},
                                              body: JSON.stringify({...form, lab})});
      data = await res.json();
    } catch (error) {
      data = {status: 0, seconds: "", text: `Error: ${error.message}`};
    }
    setRows(r => ({...r, [lab]: {state: "done", ...data}}));
  }
  async function submitAll() {
    setRunning(true);
    for (const lab of form.labs) await submitOne(lab);   // one at a time: the checker clones the repo on every call
    setRunning(false);
  }
  const verdict = (row) => {
    if (row.state === "wait") return <span className="wait">перевіряю…</span>;
    const admitted = /ДОПУЩЕНО/.test(row.text) && !/НЕ ДОПУЩЕНО/.test(row.text);
    const status = (row.text.match(/Статус звіту:\s*(\S+)/) || [])[1] || (row.text.match(/\w+Error:/) || [""])[0];
    return <span className={admitted ? "ok" : "bad"}>{admitted ? "ДОПУЩЕНО" : "НЕ ДОПУЩЕНО"} {status}</span>;
  };
  const ready = form.student_name.trim() && /^[\w.-]+\/[\w.-]+$/.test(form.repository.trim()) && form.labs.length;

  return <div>
    <h1>Перевірка лабораторних</h1>
    <p className="sub">Та сама перевірка, що на сайті викладача, але форма не скидається, лабораторні можна відправити пачкою, а кожна відповідь пояснюється.</p>
    <div className="card">
      <div className="row">
        <div><label>Студент</label><input value={form.student_name} onChange={set("student_name")} placeholder="Прізвище Ім'я — як у списку викладача" /></div>
        <div><label>GitHub repository</label><input value={form.repository} onChange={set("repository")} placeholder="user/repo" /></div>
        <div><label>Предмет</label><select value={form.course} onChange={setCourse}>
          {Object.entries(COURSES).map(([id, c]) => <option key={id} value={id}>{c.label}</option>)}</select></div>
        <div><label>Група</label><select value={form.group} onChange={set("group")}>
          {COURSES[form.course].groups.map(g => <option key={g}>{g}</option>)}</select></div>
      </div>
      <label>Лабораторні</label>
      <div className="labs">{labs.map(l => <label key={l}><input type="checkbox" checked={form.labs.includes(l)} onChange={() => toggle(l)} />{l}</label>)}
        <button className="ghost" onClick={() => setForm({...form, labs: [...labs]})}>всі</button>
        <button className="ghost" onClick={() => setForm({...form, labs: []})}>жодної</button></div>
      <button disabled={running || !ready} onClick={submitAll}>{running ? "Перевіряю…" : `Перевірити ${form.labs.length}`}</button>
      <span className="note"> &nbsp; кожна перевірка 5–15 с: сервер клонує репозиторій щоразу</span>
    </div>
    {Object.keys(rows).length > 0 && <div className="card"><table><thead><tr><th>Lab</th><th>HTTP</th><th>с</th><th>Вердикт</th><th></th></tr></thead><tbody>
      {labs.filter(l => rows[l]).map(l => { const r = rows[l]; return <tr key={l}>
        <td>{l}</td><td>{r.status ?? ""}</td><td>{r.seconds ?? ""}</td>
        <td>{verdict(r)}{r.text && <div className="why">{explain(r.text)}</div>}{r.text && <details><summary>повний текст відповіді</summary><pre>{r.text}</pre></details>}</td>
        <td><button className="ghost" disabled={running} onClick={() => submitOne(l)}>↻</button></td></tr>; })}
    </tbody></table></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
