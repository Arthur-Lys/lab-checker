<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab checker</title>
<style>
body{font:15px/1.45 system-ui,sans-serif;margin:0;padding:24px 16px;background:#f6f7f9;color:#1c1e21}
main{max-width:760px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#6b7280;margin:0 0 20px}
.step{background:#fff;border:1px solid #dde1e6;border-radius:10px;padding:14px 16px 12px;margin-bottom:12px;display:grid;grid-template-columns:32px 1fr;gap:12px}
.num{width:28px;height:28px;border-radius:50%;background:#e5e7eb;color:#374151;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step.ok .num{background:#dcfce7;color:#15803d}.step.bad .num{background:#fee2e2;color:#b91c1c}
.step label{display:block;font-weight:600;margin:2px 0 6px}
input,select{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #c9ced6;border-radius:6px;font:inherit;background:#fff}
input.bad{border-color:#ef4444}input.ok{border-color:#22c55e}
.hint{font-size:13px;margin:6px 0 0;min-height:1.2em}
.hint.bad{color:#b91c1c}.hint.ok{color:#15803d}.hint.warn{color:#b45309}.hint.muted{color:#6b7280}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.labs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.labs label{font-weight:400;margin:0;display:flex;gap:4px;align-items:center;padding:4px 8px;border:1px solid #dde1e6;border-radius:6px;background:#fafafa}
button{padding:10px 16px;border:0;border-radius:6px;background:#2563eb;color:#fff;font:inherit;cursor:pointer}
button.ghost{background:#e5e7eb;color:#111;padding:4px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.send{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.preview{font-size:13px;color:#6b7280;font-family:ui-monospace,Consolas,monospace}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid #eee;vertical-align:top}
.ok-t{color:#15803d;font-weight:600}.bad-t{color:#b91c1c;font-weight:600}.wait{color:#6b7280}
.why{margin:4px 0;color:#374151;max-width:70ch}
pre{white-space:pre-wrap;margin:6px 0 0;font-size:12px;color:#374151}
details summary{cursor:pointer;color:#2563eb;font-size:13px}
.results{background:#fff;border:1px solid #dde1e6;border-radius:10px;padding:14px 16px;margin-top:16px}
.results h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.quiz{overflow:hidden}
.bar{height:6px;background:#e5e7eb;border-radius:3px;margin:4px 0 14px;overflow:hidden}
.fill{height:100%;background:#2563eb;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.qcard{animation:qin .28s cubic-bezier(.2,.8,.2,1) both}
.qcard.out{animation:qout .18s cubic-bezier(.4,0,1,1) both}
@keyframes qin{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes qout{to{opacity:0;transform:translateX(-28px)}}
.qtext{font-size:17px;font-weight:600;margin:0 0 12px;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;color:#1c1e21;border:1px solid #dde1e6;padding:11px 12px;transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .16s,background .16s}
.opt:hover:not(:disabled){border-color:#2563eb;background:#eff6ff;transform:translateX(4px)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:disabled{opacity:.55;cursor:default}
.opt.picked,.opt.picked:disabled{opacity:1;border-color:#2563eb;background:#dbeafe;transform:none}
.opt .key{flex:none;width:22px;height:22px;border-radius:6px;background:#e5e7eb;color:#374151;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.picked .key{background:#2563eb;color:#fff}
.score{text-align:center;padding:8px 0 2px}
.score .big{font-size:58px;font-weight:800;line-height:1;color:#1d4ed8;letter-spacing:-1px}
.score .max{font-size:22px;color:#6b7280;font-weight:600;margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 10px}
.tile{background:#f6f7f9;border-radius:8px;padding:10px;text-align:center;animation:qin .4s cubic-bezier(.2,.8,.2,1) both}
.tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}
.tile .v{font-size:22px;font-weight:700}.tile .l{font-size:12px;color:#6b7280}
.grade{text-align:center;margin:0 0 12px;font-size:15px}
.secret{border-color:#a78bfa}.secret input{margin:2px 0 4px}.secret td:first-child{width:58%}.secret b{color:#4c1d95}
</style>
</head>
<body>
<main id="root"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

const COURSES = {
  professional_python: {label: "Професійний Python", labs: 10, groups: ["ФеП-31", "ФеП-32", "ФеП-33"]},
  functional_programming: {label: "Функціональне програмування", labs: 8, groups: ["ФЕП-22с", "ФЕП-23с", "ФеП-21"]},
};
const labsOf = (course) => Array.from({length: COURSES[course].labs}, (_, i) => `Lab_${String(i + 1).padStart(2, "0")}`);

// what the checker answers -> what it means. First match wins.
const EXPLAIN = [
  [/timed out/i, "Перевірка довша за 55 с — сервер прокидається або клонує великий репозиторій. Повтори за хвилину."],
  [/^Error:/, "Сервер перевірки не відповідає. Повтори за хвилину."],
  [/Bad Gateway|Service Unavailable|Gateway Time-out|Application failed to respond/i, "Сервер викладача (Render) не відповів. Повтори за хвилину."],
  [/Студента не знайдено/, "Такого студента нема у списку групи. Треба точно як у викладача: «Прізвище Ім'я», кирилицею, без по батькові."],
  [/Не заповнені всі необхідні поля/, "Порожнє поле."],
  [/could not read Username|Repository not found/i, "GitHub не знайшов репозиторій: помилка в назві або він приватний."],
  [/Не вдалося клонувати/, "git clone не вдався. Формат user/repo, репозиторій public."],
  [/не знайдено каталог Lab_/, "У корені репозиторію нема каталогу Lab_NN (нуль і підкреслення, у корені, у гілці за замовчуванням)."],
  [/REPORT_NOT_FOUND/, "У каталозі нема файлу звіту. Потрібен pdf або docx зі словом «report» у назві, наприклад Lab_01_report.pdf."],
  [/декілька можливих звітів/, "Схожих на звіт файлів більше одного — залиш рівно один."],
  [/VARIANT_NOT_FOUND|не (вдалося )?(знайти|визначити) (номер )?варіант/i, "У тексті звіту нема «Варіант №N». Додай на титулку."],
  [/CONTENT_VARIANT_MISMATCH/, "Сервер каже, що зміст не відповідає варіанту. Станом на 15.09.2026 він каже це на будь-який звіт, включно з текстом завдання викладача. Помилка на сервері."],
  [/VARIANT_MISMATCH/, "«Варіант №N» у звіті не збігається з варіантом, закріпленим за студентом. Дивись два рядки нижче."],
  [/REPORT_(READ|PARSE)_ERROR|не вдалося прочитати звіт|Помилка під час перевірки звіту/i, "Сервер не зміг прочитати файл звіту. Перезбережи як звичайний pdf з назвою Lab_NN_report.pdf."],
  [/не належить курсу/, "Групу не прийнято — список на сервері змінився."],
  [/Rules for course .* were not found/, "На сервері нема правил для цієї лабораторної. Її поки ніхто не може перевірити."],
  [/^До захисту ДОПУЩЕНО/m, "Пройшло. Тест із 50 питань — нижче, на цій сторінці."],
  [/ModuleNotFoundError|ImportError|KeyError/, "Внутрішня помилка сервера, не твоя."],
  [/ValueError|RuntimeError|Помилка під час/, "Сервер упав. Текст після назви винятку каже, на чому."],
  [/404|Not Found/i, "Адреса перевірки не відповідає (404) — сайт перенесли?"],
];
const explain = (text, status) => (EXPLAIN.find(([re]) => re.test(text)) || [null, status >= 500 ? `Помилка сервера ${status}.` : "Невідома відповідь — читай повний текст."])[1];

// local checks before anything is sent
function normalizeRepo(raw) {
  let s = raw.trim().replace(/^(https?:\/\/)?(www\.)?github\.com[\/:]/i, "").replace(/^git@github\.com:/i, "")
    .replace(/\.git$/i, "").replace(/^\/+|\/+$/g, "");
  const parts = s.split("/").filter(Boolean);
  if (parts.length > 2) s = parts.slice(0, 2).join("/");
  return s;
}
function checkRepo(raw) {
  if (!raw.trim()) return {level: "muted", text: "user/repo"};
  const norm = normalizeRepo(raw);
  if (/\s/.test(norm)) return {level: "bad", text: "Пробіл у назві"};
  if (!norm.includes("/")) return {level: "bad", text: "Нема слеша: user/repo"};
  if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(norm)) return {level: "bad", text: "Лише латиниця, цифри, . - _"};
  if (norm !== raw.trim()) return {level: "ok", text: `→ ${norm}`, fixed: norm};
  return {level: "ok", text: ""};
}
function checkName(raw) {
  const s = raw.trim().replace(/\s+/g, " ");
  if (!s) return {level: "muted", text: "Прізвище Ім'я"};
  if (/[A-Za-z]/.test(s)) return {level: "bad", text: "Латиниця — у списку кирилиця"};
  if (/\d/.test(s)) return {level: "bad", text: "Цифри в імені"};
  const words = s.split(" ");
  if (words.length < 2) return {level: "bad", text: "Потрібні прізвище та ім'я"};
  if (words.length > 2) return {level: "warn", text: "Зазвичай без по батькові"};
  return {level: "ok", text: ""};
}

const KEY = "lab-checker-form", RKEY = "lab-checker-results", SKEY = "lab-checker-secret";
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)) || null; } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const Step = ({n, state, children}) => <div className={`step ${state || ""}`}><div className="num">{n}</div><div>{children}</div></div>;
// ↑↑↓↓←→←→ B A Enter, typed anywhere outside a field, opens the answer table
const KONAMI = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a", "Enter"];
function useKonami(handlers) {
  const pos = useRef(0), h = useRef(handlers);
  h.current = handlers;
  useEffect(() => {
    const onKey = (e) => {
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      const was = pos.current;
      pos.current = k === KONAMI[pos.current] ? pos.current + 1 : k === KONAMI[0] ? 1 : 0;
      if (pos.current > was && k.startsWith("Arrow")) e.preventDefault();
      if (pos.current === KONAMI.length) { pos.current = 0; h.current.onHit(); }
      else if (pos.current > was) h.current.onStep(pos.current, k);
      else if (was > 1) h.current.onMiss();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
}

// the Lab_01 quiz pool (answers.json), searchable by text: the server shuffles the letters on every draw
function Answers({onHide}) {
  const [data, setData] = useState(null);
  const [q, setQ] = useState("");
  const box = useRef(null);
  useEffect(() => {
    fetch("/answers.json").then(r => r.json()).then(setData).catch(() => setData({error: true}));
    box.current && box.current.scrollIntoView({behavior: "smooth", block: "start"});
  }, []);
  const norm = (s) => s.toLowerCase().replace(/\s+/g, " ").trim();
  const all = (data && data.questions) || [];
  const rows = q.trim() ? all.filter(r => norm(r.q + " " + r.a).includes(norm(q))) : all;
  return <div className="results secret" ref={box}>
    <h2><span>{data ? `${data.lab} · відповіді на тест` : "…"}<span className="preview"> · {all.length} питань</span></span>
        <button className="ghost" onClick={onHide}>сховати</button></h2>
    <input autoFocus value={q} onChange={e => setQ(e.target.value)} placeholder="шукай за текстом питання" />
    <p className="hint muted">{data && data.error ? "answers.json не завантажився" : `${rows.length} з ${all.length} · літери A–D перемішуються щоразу, шукай за текстом`}</p>
    <table><tbody>{rows.map(r => <tr key={r.q}><td>{r.q}</td><td><b>{r.a}</b></td></tr>)}</tbody></table>
  </div>;
}
const QKEY = "lab-checker-quiz";
const quizPost = (body) => fetch("/api/quiz", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)}).then(r => r.json());

// eased count-up for the result numbers
function Count({to, max, ms = 900}) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf, t0;
    const step = (t) => { t0 = t0 || t; const p = Math.min(1, (t - t0) / ms); setV(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [to]);
  return <>{v}{max != null && <span className="max">/ {max}</span>}</>;
}

// the teacher's quiz, driven through api/quiz.py. One click sends the answer; there is no way back on his side.
function Quiz({quiz, onChange, onRestart, running}) {
  const [phase, setPhase] = useState("in");     // in | out
  const [picked, setPicked] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const q = quiz.question;

  async function answer(k) {
    if (busy || !q) return;
    setBusy(true); setPicked(k); setErr(null);
    let d;
    try { d = await quizPost({session: quiz.session, answer: k}); }
    catch (error) { d = {error: `Мережа: ${error.message}`}; }
    if (d.expired) { onChange({...quiz, expired: true}); setBusy(false); return; }
    if (d.error) { setErr(d.error); setPicked(null); setBusy(false); return; }
    setPhase("out");
    setTimeout(() => {
      onChange(d.done ? {...quiz, question: null, result: d.result} : {...quiz, question: d.question});
      setPicked(null); setPhase("in"); setBusy(false);
    }, 180);
  }
  useEffect(() => {   // keys 1–4 answer too
    const onKey = (e) => {
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      const i = "1234".indexOf(e.key);
      if (i >= 0 && q && q.opts[i]) answer(q.opts[i].k);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const head = (extra) => <h2><span>Тест · {quiz.lab}{extra}</span>
    <button className="ghost" disabled={busy || running} onClick={onRestart}>{running ? "перевіряю…" : "заново"}</button></h2>;

  if (quiz.expired) return <div className="results quiz">{head(null)}
    <p className="hint bad">Сесія тесту на сервері закінчилась. «Заново» перевірить лабораторну ще раз і роздасть нові 50 питань.</p></div>;

  if (quiz.result) {
    const r = quiz.result;
    const n = (k) => r[k] && typeof r[k] === "object" ? r[k] : null;
    return <div className="results quiz">{head(<span className="preview"> · результат</span>)}
      <div className="score"><div className="big">{n("total") ? <Count to={n("total").got} max={n("total").max} /> : "—"}</div></div>
      <div className="tiles">
        {[["code", "Код"], ["report", "Звіт"], ["test", "Тест"]].map(([k, l]) => <div className="tile" key={k}>
          <div className="v">{n(k) ? <Count to={n(k).got} max={n(k).max} ms={700} /> : "—"}</div><div className="l">{l}</div></div>)}
      </div>
      <p className="grade">Бали за лабораторну: <b>{r.grade ?? "—"}</b>{r.status && <span className="preview"> · {r.status}</span>}</p>
      <p className="hint muted">Результат записано на сервері викладача. Спроб необмежено — «заново» роздасть нові 50.</p></div>;
  }

  if (!q) return <div className="results quiz">{head(null)}<p className="hint muted">завантажую питання…</p></div>;

  return <div className="results quiz">{head(<span className="preview"> · {q.n} із {q.total}</span>)}
    <div className="bar"><div className="fill" style={{width: `${((q.n - 1) / q.total) * 100}%`}} /></div>
    <div key={q.n} className={`qcard ${phase}`}>
      <p className="qtext">{q.q}</p>
      <div className="opts">{q.opts.map((o, i) => <button key={o.k} className={`opt ${picked === o.k ? "picked" : ""}`} disabled={busy} onClick={() => answer(o.k)}>
        <span className="key">{i + 1}</span><span>{o.t}</span></button>)}</div>
    </div>
    {err && <p className="hint bad">{err}</p>}
    <p className="hint muted">клік або клавіші 1–4 · відповідь іде одразу, назад дороги нема</p>
  </div>;
}
const post = (body) => fetch("/api/submit", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)}).then(r => r.json());

function App() {
  const [form, setForm] = useState({student_name: "", course: "professional_python", group: "ФеП-31",
                                    repository: "", labs: ["Lab_01"], ...(load(KEY) || {})});
  const [results, setResults] = useState(load(RKEY) || {rows: {}, at: null});
  const [running, setRunning] = useState(false);
  const [nameApi, setNameApi] = useState({state: "idle"});   // idle | checking | ok | bad | error
  const [secret, setSecret] = useState(!!load(SKEY));
  const [quiz, setQuiz] = useState(load(QKEY));
  useEffect(() => save(QKEY, quiz), [quiz]);
  // a reload mid-quiz: the server's GET is idempotent, so pick the current question back up
  useEffect(() => {
    if (!quiz || !quiz.session || quiz.result || quiz.expired) return;
    quizPost({session: quiz.session}).then(d => {
      if (d.expired) setQuiz(z => ({...z, expired: true}));
      else if (d.done) setQuiz(z => ({...z, question: null, result: d.result}));
      else if (d.question) setQuiz(z => ({...z, question: d.question}));
    }).catch(() => {});
  }, []);
  const page = useRef(null);
  const nudge = (key, step) => {
    const el = page.current;
    if (!el || !el.animate) return;
    const amp = 4 + step * 2;
    const move = (x, y) => [{transform: "translate(0,0)"}, {transform: `translate(${x}px,${y}px)`, offset: .35}, {transform: "translate(0,0)"}];
    const pulse = (k) => [{transform: "scale(1)"}, {transform: `scale(${k})`, offset: .4}, {transform: "scale(1)"}];
    const frames = key === "ArrowUp" ? move(0, -amp) : key === "ArrowDown" ? move(0, amp)
      : key === "ArrowLeft" ? move(-amp, 0) : key === "ArrowRight" ? move(amp, 0)
      : key === "b" ? pulse(.982) : key === "a" ? pulse(1.018)
      : key === "Enter" ? [{transform: "scale(1)", filter: "brightness(1)"}, {transform: "scale(1.03)", filter: "brightness(1.18)", offset: .3}, {transform: "scale(1)", filter: "brightness(1)"}]
      : [{transform: "translateX(0)"}, {transform: "translateX(-6px)", offset: .2}, {transform: "translateX(6px)", offset: .5}, {transform: "translateX(-3px)", offset: .8}, {transform: "translateX(0)"}];
    el.animate(frames, {duration: key === "Enter" ? 420 : 300, easing: "cubic-bezier(.2,.8,.2,1)"});
  };
  useKonami({onStep: (step, k) => step >= 2 && nudge(k, step), onMiss: () => nudge("miss", 0),
             onHit: () => { nudge("Enter", 11); setSecret(true); }});
  useEffect(() => save(SKEY, secret), [secret]);
  const nameReq = useRef(0);
  const labs = labsOf(form.course);
  const rows = results.rows;
  useEffect(() => save(KEY, form), [form]);
  useEffect(() => save(RKEY, results), [results]);

  const nameLocal = checkName(form.student_name);
  const repoCheck = checkRepo(form.repository);
  const labsOk = form.labs.length > 0;
  const payload = {...form, student_name: form.student_name.trim().replace(/\s+/g, " "), repository: normalizeRepo(form.repository)};

  // 500 ms after typing stops, ask the real server whether the name exists in this group (dummy repo: it fails fast)
  useEffect(() => {
    if (nameLocal.level === "bad" || nameLocal.level === "muted") { setNameApi({state: "idle"}); return; }
    setNameApi({state: "checking"});
    const id = ++nameReq.current;
    const timer = setTimeout(async () => {
      try {
        const d = await post({student_name: payload.student_name, course: form.course, group: form.group, lab: "Lab_01", repository: "nobody-000/does-not-exist-000"});
        if (id !== nameReq.current) return;
        // the server checks the name before it touches the repo, so any answer past that point means the name exists
        if (/Студента не знайдено/.test(d.text)) setNameApi({state: "bad"});
        else if (d.status === 0 || d.status === 502 || d.status === 503 || d.status === 504 || /^Error:/.test(d.text)) setNameApi({state: "error"});
        else setNameApi({state: "ok"});
      } catch { if (id === nameReq.current) setNameApi({state: "error"}); }
    }, 500);
    return () => clearTimeout(timer);
  }, [payload.student_name, form.group, form.course]);

  const nameHint = nameLocal.level === "bad" || nameLocal.level === "muted" ? nameLocal
    : nameApi.state === "checking" ? {level: "muted", text: "перевіряю у списку…"}
    : nameApi.state === "ok" ? {level: "ok", text: `є у списку ${form.group}`}
    : nameApi.state === "bad" ? {level: "bad", text: `нема у списку ${form.group} — перевір написання`}
    : nameApi.state === "error" ? {level: "warn", text: "сервер не відповів, список не перевірено"}
    : nameLocal;
  const nameState = nameHint.level === "bad" ? "bad" : nameApi.state === "ok" ? "ok" : "";
  const ready = nameLocal.level !== "bad" && nameLocal.level !== "muted" && nameApi.state !== "bad" && repoCheck.level === "ok" && labsOk;

  const set = (k) => (e) => setForm({...form, [k]: e.target.value});
  const setCourse = (e) => {
    const course = e.target.value;
    setForm({...form, course, group: COURSES[course].groups[0], labs: form.labs.filter(l => labsOf(course).includes(l))});
  };
  const toggle = (lab) => setForm({...form, labs: form.labs.includes(lab) ? form.labs.filter(l => l !== lab) : [...form.labs, lab].sort()});

  async function submitOne(lab) {
    setResults(r => ({rows: {...r.rows, [lab]: {state: "wait"}}, at: new Date().toISOString()}));
    let data;
    try { data = await post({...payload, lab}); }
    catch (error) { data = {status: 0, seconds: "", text: `Error: ${error.message}`}; }
    setResults(r => ({rows: {...r.rows, [lab]: {state: "done", ...data}}, at: new Date().toISOString()}));
    if (data.passed && data.session) setQuiz({lab, session: data.session, question: data.question, at: new Date().toISOString()});
  }
  async function submitAll() {
    setRunning(true);
    for (const lab of form.labs) await submitOne(lab);   // sequential: the server clones the repo on every call
    setRunning(false);
  }
  const verdict = (row) => {
    if (row.state === "wait") return <span className="wait">перевіряю…</span>;
    const admitted = /ДОПУЩЕНО/.test(row.text) && !/НЕ ДОПУЩЕНО/.test(row.text);
    const status = (row.text.match(/Статус звіту:\s*(\S+)/) || [])[1] || (row.text.match(/\w+Error/) || [""])[0] || (row.status ? `HTTP ${row.status}` : "мережа");
    return <span className={admitted ? "ok-t" : "bad-t"}>{admitted ? "ДОПУЩЕНО" : "НЕ ДОПУЩЕНО"} · {status}</span>;
  };
  const cls = (c) => c.level === "bad" ? "bad" : c.level === "ok" ? "ok" : "";

  return <div ref={page}>
    <h1>Перевірка лабораторних</h1>
    <p className="sub">Той самий сервер перевірки, що на сайті викладача. Форма не скидається, лабораторні пачкою, відповіді пояснені.</p>

    <Step n="1" state={nameState}>
      <label>Студент</label>
      <input className={cls(nameHint)} value={form.student_name} onChange={set("student_name")} placeholder="Прізвище Ім'я" />
      <p className={`hint ${nameHint.level}`}>{nameHint.text}</p>
    </Step>

    <Step n="2" state={cls(repoCheck)}>
      <label>GitHub repository</label>
      <input className={cls(repoCheck)} value={form.repository} onChange={set("repository")}
             onBlur={() => repoCheck.fixed && setForm({...form, repository: repoCheck.fixed})} placeholder="user/repo або посилання" />
      <p className={`hint ${repoCheck.level}`}>{repoCheck.text}</p>
    </Step>

    <Step n="3" state="ok">
      <div className="grid">
        <div><label>Предмет</label><select value={form.course} onChange={setCourse}>
          {Object.entries(COURSES).map(([id, c]) => <option key={id} value={id}>{c.label}</option>)}</select></div>
        <div><label>Група</label><select value={form.group} onChange={set("group")}>
          {COURSES[form.course].groups.map(g => <option key={g}>{g}</option>)}</select></div>
      </div>
    </Step>

    <Step n="4" state={labsOk ? "ok" : "bad"}>
      <label>Лабораторні</label>
      <div className="labs">{labs.map(l => <label key={l}><input type="checkbox" checked={form.labs.includes(l)} onChange={() => toggle(l)} />{l}</label>)}</div>
      <button className="ghost" onClick={() => setForm({...form, labs: [...labs]})}>всі</button>{" "}
      <button className="ghost" onClick={() => setForm({...form, labs: []})}>жодної</button>
      <p className={`hint ${labsOk ? "muted" : "bad"}`}>{labsOk ? "по 5–15 с кожна" : "Вибери хоча б одну"}</p>
    </Step>

    <Step n="5" state={ready ? "ok" : ""}>
      <div className="send">
        <button disabled={running || !ready} onClick={submitAll}>{running ? "Перевіряю…" : `Перевірити ${form.labs.length}`}</button>
        <span className="preview">{payload.student_name || "…"} · {form.group} · {payload.repository || "…"}</span>
      </div>
    </Step>

    {Object.keys(rows).length > 0 && <div className="results">
      <h2><span>Результати{results.at && <span className="preview"> · {new Date(results.at).toLocaleString("uk-UA")}</span>}</span>
          <button className="ghost" disabled={running} onClick={() => setResults({rows: {}, at: null})}>очистити</button></h2>
      <table><thead><tr><th>Lab</th><th>HTTP</th><th>с</th><th>Вердикт</th><th></th></tr></thead><tbody>
        {labs.filter(l => rows[l]).map(l => { const r = rows[l]; return <tr key={l}>
          <td>{l}</td><td>{r.status ?? ""}</td><td>{r.seconds ?? ""}</td>
          <td>{verdict(r)}{r.text && <div className="why">{explain(r.text, r.status)}</div>}{r.text && <details><summary>повний текст</summary><pre>{r.text}</pre></details>}</td>
          <td><button className="ghost" disabled={running} onClick={() => submitOne(l)}>↻</button></td></tr>; })}
      </tbody></table>
    </div>}

    {quiz && <Quiz quiz={quiz} running={running} onChange={setQuiz} onRestart={() => submitOne(quiz.lab)} />}

    {secret && <Answers onHide={() => setSecret(false)} />}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
